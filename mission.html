<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Миссия компании | Технохолдинг</title>
    <script>
      const fragment = location.hash;
      let destination = 'index.html#mission';

      if (/^#(?:talents|talents-title|talent-[12])$/.test(fragment)) {
        destination = 'index.html#home-mission-talents-title';
      } else if (/^#(?:values|values-title)$/.test(fragment)) {
        destination = 'values.html';
      } else if (/^#(?:initiative|belief|trust|reputation|craft)$/.test(fragment)) {
        destination = 'values.html' + fragment;
      } else if (fragment === '#contacts') {
        destination = 'index.html#contacts';
      }

      const url = new URL(destination, location.href);
      url.search = location.search;
      location.replace(url);
    </script>
    <meta http-equiv="refresh" content="0; url=index.html#mission" />
    <link rel="canonical" href="https://thld.su/" />
  </head>
  <body>
    <p><a href="index.html#mission">Миссия компании на главной</a></p>
  </body>
</html>

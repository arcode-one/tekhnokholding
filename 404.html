<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Страница не найдена | Технохолдинг</title>
    <script>
      // GitHub Pages сохраняет запрошенный URL при показе 404.html.
      // Старые закладки hero-test ведут на соответствующие страницы нового сайта.
      const siteRoot = location.hostname === 'arcode-one.github.io' ? '/tekhnokholding/' : '/';
      for (const attributes of [
        { rel: 'icon', type: 'image/x-icon', href: 'icons/favicon.ico', sizes: '16x16 32x32 48x48' },
        { rel: 'icon', type: 'image/svg+xml', href: 'icons/favicon.svg', sizes: 'any' },
        { rel: 'apple-touch-icon', href: 'icons/apple-touch-icon.png', sizes: '180x180' },
      ]) {
        const icon = document.createElement('link');
        for (const [name, value] of Object.entries(attributes))
          icon.setAttribute(name, name === 'href' ? siteRoot + value : value);
        document.head.append(icon);
      }
      // Абсолютный путь нужен и для неизвестных вложенных адресов GitHub Pages.
      for (const stylesheet of ['fonts', 'palette']) {
        const styles = document.createElement('link');
        styles.rel = 'stylesheet';
        styles.href = siteRoot + 'css/base/' + stylesheet + '.css';
        document.head.append(styles);
      }
      for (const subset of ['cyrillic', 'latin']) {
        const fontPreload = document.createElement('link');
        fontPreload.rel = 'preload';
        fontPreload.as = 'font';
        fontPreload.type = 'font/woff2';
        fontPreload.crossOrigin = '';
        fontPreload.href = siteRoot + 'fonts/manrope/manrope-' + subset + '-wght-normal.woff2';
        document.head.append(fontPreload);
      }
      const oldRoot = siteRoot + 'hero-test';
      const oldPage = location.pathname === oldRoot
        ? ''
        : location.pathname.startsWith(oldRoot + '/')
          ? location.pathname.slice(oldRoot.length + 1)
          : null;
      const destination = oldPage === '' ? 'index.html' : oldPage;
      const pages = ['index.html', 'mission.html', 'objects.html', 'quality.html',
        'team.html', 'corporate-life.html', 'privacy.html'];
      if (destination !== null && (pages.includes(destination)
        || /^objects\/(?:obj-\d{2}|thld-[a-f0-9]{12})\.html$/.test(destination))) {
        location.replace(siteRoot + destination + location.search + location.hash);
      }
    </script>
    <style>
      html { color-scheme: dark; background: #2a2c2f; color: #fff; }
      body { margin: 0; font: 18px/1.5 'Manrope', sans-serif; }
      main { box-sizing: border-box; min-height: 100svh; display: grid; align-content: center; padding: clamp(24px, 8vw, 120px); }
      h1 { margin: 0 0 24px; font-size: clamp(32px, 6vw, 72px); line-height: 1.1; }
      p { margin: 0 0 32px; }
      a { justify-self: start; padding: 14px 24px; border: var(--theme-border-width) solid var(--theme-button-on-dark-border); border-radius: 32px; background: var(--theme-button-on-dark-bg); color: var(--theme-button-on-dark-text); text-decoration: none; transition: background-color var(--theme-hover-duration) var(--theme-hover-easing), color var(--theme-hover-duration) var(--theme-hover-easing); }
      a:focus-visible { background: var(--theme-button-on-dark-hover-bg); color: var(--theme-button-on-dark-hover-text); outline: 2px solid var(--theme-text-inverse); outline-offset: 4px; }
      @media (hover: hover) and (pointer: fine) {
        a:hover { background: var(--theme-button-on-dark-hover-bg); color: var(--theme-button-on-dark-hover-text); }
      }
      @media (prefers-reduced-motion: reduce) {
        a { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Страница не найдена</h1>
      <p>Проверь адрес или перейди на главную.</p>
      <a id="home-link" href="/tekhnokholding/index.html">На главную</a>
    </main>
    <script>
      document.getElementById('home-link').href = siteRoot + 'index.html';
    </script>
  </body>
</html>
